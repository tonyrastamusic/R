<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root, [data-theme="dark"] {

    --bg-input: #26262a; --bg-input-focus: #2f2f33; --border: #26262a;

  [data-theme="light"] {

  [data-accent="green"]  { --accent: #4ade80; --accent-soft: rgba(74,222,128,0.15); --accent-light: #86efac; --accent-secondary: #22c55e; }
  [data-accent="pink"]   { --accent: #ec4899; --accent-soft: rgba(236,72,153,0.15); --accent-light: #f9a8d4; --accent-secondary: #db2777; }

  [data-theme="light"][data-accent="blue"]   { --accent-secondary: #2563eb; --accent-light: #2563eb; }
  [data-theme="light"][data-accent="green"]  { --accent-secondary: #16a34a; --accent-light: #16a34a; }
  [data-theme="light"][data-accent="pink"]   { --accent-secondary: #be185d; --accent-light: #be185d; }
  [data-theme="light"][data-accent="orange"] { --accent-secondary: #c2410c; --accent-light: #ea580c; }
  [data-theme="light"][data-accent="gray"]   { --accent-secondary: #374151; --accent-light: #4b5563; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

  .icon-sm { width: 16px; height: 16px; }

  .bottom-bar::before { content: ''; position: absolute; inset: -40px -20px -20px -20px; background: linear-gradient(to top, var(--bg) 50%, transparent); pointer-events: none; z-index: -1; }
  .bar-btn { flex: 1 1 0; min-width: 0; border: none; border-radius: 16px; padding: 18px 16px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; white-space: nowrap; transition: transform 0.1s; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; justify-content: center; gap: 6px; }

  .input { background: var(--bg-card); border: none; border-radius: 12px; padding: 14px 16px; color: var(--text); font-size: 16px; font-family: inherit; outline: none; width: 100%; margin-bottom: 12px; }
